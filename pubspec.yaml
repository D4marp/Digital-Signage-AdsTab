name: digital_signage
description: Flutter Digital Signage App for hotels and restaurants
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  
  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Image & Video
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  
  # Charts & Analytics
  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.3.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  device_info_plus: ^9.1.1
  connectivity_plus: ^5.0.2
  permission_handler: ^11.2.0
  url_launcher: ^6.2.3
  flutter_dotenv: ^5.1.0
  
  # Carousel & Slideshow
  carousel_slider: ^4.2.1
  
  # QR Code Generation
  qr_flutter: ^4.1.0
  
  # PDF Export
  pdf: ^3.10.7
  printing: ^5.12.0
  
  # CSV Export
  csv: ^6.0.0
  
  # SVG Support
  flutter_svg: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  flutter_gen: ^5.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env
    - .env.local
    - .env.production


flutter_gen:
  output: lib/gen
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enabled: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
